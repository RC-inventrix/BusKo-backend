spring:
  application:
    name: busko-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/busko_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

busko:
  websocket:
    # Comma-separated list of allowed WebSocket origins.
    # Override this in production with the exact front-end origin(s).
    allowed-origins: "*"